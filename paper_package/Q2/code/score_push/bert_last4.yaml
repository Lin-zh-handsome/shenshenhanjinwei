run_name: Deployable_BERT_Last4
aligned_pkl: /path/to/aligned_50.pkl
output_dir: outputs/q2_score_push/deployable_bert/partial_last4
seed: 42
text_mode: pretrained_bert
bert_model_path: /path/to/bert-base-uncased
unfreeze_last_n_layers: 4
init_checkpoint: outputs/q2_v2/01_run_a_oracle_text/best_macro_f1.pt
modalities: TAV
use_position: false
d_model: 128
heads: 4
temporal_layers: 1
dropout: 0.15
batch_size: 32
epochs: 30
patience: 8
lr: 0.0002
bert_lr: 0.00001
weight_decay: 0.01
warmup_ratio: 0.05
lambda_reg: 0.5
lambda_distill: 0.0
selection_metric: classification
grad_clip: 1.0
amp: true
